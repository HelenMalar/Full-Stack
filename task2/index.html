<!DOCTYPE html>
<html>
<head><title>Registration</title></head>
<body style="font-family: Arial; background: #f2f2f2; padding:20px;">
    <h2 style="color: blue; text-align:center;">User Registration</h2>
    <form action="/register" method="POST" onsubmit="return validateForm()" 
          style="width:350px; margin:auto; padding:20px; background:white; border-radius:10px; box-shadow:0 0 10px #ccc;">
        <p id="msg" style="color:red; font-size:14px;"></p>
        <label>Full Name:</label><br>
        <input type="text" id="name" name="name" style="width:100%; margin-bottom:10px;">
        <label>Email:</label><br>
        <input type="email" id="email" name="email" style="width:100%; margin-bottom:10px;">
        <label>Password:</label><br>
        <input type="password" id="pw" name="password" style="width:100%; margin-bottom:10px;">
        <label>Confirm:</label><br>
        <input type="password" id="cpw" style="width:100%; margin-bottom:10px;">
        <label>Age:</label><br>
        <input type="number" id="age" name="age" style="width:100%; margin-bottom:10px;">
        <label>Gender:</label><br>
        <input type="radio" name="gender" value="Female">Female
        <input type="radio" name="gender" value="Male">Male<br><br>
        <label>Address:</label><br>
        <input type="text" id="address" name="address" style="width:100%; margin-bottom:10px;">
        <label>Phone:</label><br>
        <input type="text" id="phone" name="phone" style="width:100%; margin-bottom:10px;">
        <label>Skills:</label><br>
        <input type="checkbox" name="skills" value="Java"> Java 
        <input type="checkbox" name="skills" value="Python"> Python
        <input type="checkbox" name="skills" value="C++"> C++
        <input type="checkbox" name="skills" value="C"> C<br><br>
        <label>Country:</label>
        <select name="country" id="country" style="width:100%;">
            <option value="">Select</option>
            <option>India</option><option>USA</option><option>Italy</option><option>Japan</option><option>Canada</option>
        </select><br><br>
        <button type="submit" style="width:100%; padding:10px; background:green; color:white; border:none; cursor:pointer;">
            Register
        </button>
    </form>
    <script>
        function validateForm() {
            const get = (id) => document.getElementById(id).value;
            const err = (txt) => { document.getElementById("msg").innerText = txt; return false; };
            if (!get("name") || !get("email") || !get("pw") || !get("age") || !get("phone")) return err("All fields required!");
            if (!/^[A-Za-z ]+$/.test(get("name"))) return err("Name must be alphabets only!");
            if (get("pw") !== get("cpw")) return err("Passwords do not match!");
            if (get("pw").length < 6) return err("Password too short!");
            if (get("age") < 18 || get("age") > 60) return err("Age must be 18-60!");
            if (!/^\d{10}$/.test(get("phone"))) return err("Phone must be 10 digits!");  
            return true;
        }
    </script>
</body>
</html>
